name: Update profile dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/github-dashboard.svg"
      - "assets/github-dashboard.png"
      - "assets/profile-banner.png"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Generate dashboard SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_dashboard.py

      - name: Render profile images as PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="assets/profile-banner.svg",
              write_to="assets/profile-banner.png",
              output_width=1200,
          )
          cairosvg.svg2png(
              url="assets/github-dashboard.svg",
              write_to="assets/github-dashboard.png",
              output_width=1200,
          )
          PY

      - name: Commit updated profile assets
        run: |
          if git diff --quiet -- assets/github-dashboard.svg assets/github-dashboard.png assets/profile-banner.png; then
            echo "Profile assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-dashboard.svg assets/github-dashboard.png assets/profile-banner.png
          git commit -m "chore: update profile assets"
          git push
