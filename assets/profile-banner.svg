      <stop stop-color="#070B14"/>
      <stop offset="0.52" stop-color="#0D1326"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="70" x2="820" y2="235" gradientUnits="userSpaceOnUse">
